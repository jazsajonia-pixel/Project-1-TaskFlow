name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_PASSWORD: ci-isolated-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d taskflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: postgresql://postgres:ci-isolated-password@127.0.0.1:5432/taskflow_test
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:4000
      NODE_ENV: test
      UPLOAD_DIR: ./uploads/test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
