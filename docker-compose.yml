services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
  server:
    build:
      context: .
      target: server
    env_file: .env
    environment:
      NODE_ENV: ${COMPOSE_NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      CLIENT_URL: ${COMPOSE_CLIENT_URL:-http://localhost:8080}
      SERVER_URL: ${COMPOSE_CLIENT_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY_HOPS: 1
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  client:
    build:
      context: .
      target: client
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
