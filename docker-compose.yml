services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskflow}
      MYSQL_USER: ${MYSQL_USER:-taskflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-taskflow}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-taskflow}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      mysql:
        condition: service_healthy
  server:
    build:
      context: .
      target: server
    env_file: .env
    environment:
      NODE_ENV: ${COMPOSE_NODE_ENV:-development}
      DATABASE_URL: mysql://${MYSQL_USER:-taskflow}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-taskflow}
      CLIENT_URL: ${COMPOSE_CLIENT_URL:-http://localhost:8080}
      SERVER_URL: ${COMPOSE_CLIENT_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY_HOPS: 1
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  client:
    build:
      context: .
      target: client
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
  uploads:
